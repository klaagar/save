<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกการขาย</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
    body { font-family: 'Kanit', sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .header-image { 
      width: 100%; 
      height: auto; 
      aspect-ratio: 1000 / 334; 
      background-image: url(https://lh3.googleusercontent.com/d/1g7peh4Iz0oTxrNKEzmxOgHo1RY4WoaJ2); 
      background-size: contain; 
      background-repeat: no-repeat; 
      background-position: top center;
      background-color: white;
    }
    .header { background: #88d462; padding: 15px; text-align: center; color: white; }
    .header h2 { margin: 0; font-size: 22px; }
    .container { max-width: 450px; margin: 20px auto; padding: 20px; background: white; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 85%; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 13px; color: #999; margin-bottom: 5px; }
    .field input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; font-family: 'Kanit', sans-serif; box-sizing: border-box; }
    .field input:focus { outline: none; border-color: #88d462; }
    .total-box { background: #e8f5e9; border-radius: 12px; padding: 15px; text-align: center; margin: 20px 0; }
    .total-box .label { font-size: 13px; color: #666; }
    .total-box input { background: transparent; border: none; border-bottom: 2px solid #88d462; border-radius: 0; text-align: center; font-size: 32px; font-weight: bold; color: #2e7d32; width: 100%; font-family: 'Kanit', sans-serif; }
    .total-box input:focus { outline: none; }
    .btn-save { background: #88d462; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; font-family: 'Kanit', sans-serif; }
    .btn-save:disabled { background: #ccc; cursor: not-allowed; }
    .status-box { margin-top: 15px; padding: 12px; border-radius: 12px; text-align: center; display: none; }
    .status-box.success { background: #e8f5e9; color: #2e7d32; }
    .status-box.error { background: #fdecea; color: #c62828; }
  </style>
</head>
<body>

  <div class="header-image"></div>
  <div class="header">
    <h2>📝 บันทึกการขาย</h2>
  </div>

  <div class="container">

    <div class="field">
      <label>🏪 ขายให้</label>
      <input type="text" id="shopName" placeholder="ชื่อร้าน">
    </div>

    <div class="field">
      <label>🍊 ผลไม้</label>
      <input type="text" id="itemName" placeholder="ชื่อผลไม้">
    </div>

    <div class="field">
      <label>⚖️ น้ำหนัก (กก.)</label>
      <input type="number" id="weight" placeholder="กรอกน้ำหนักที่ขายจริง" oninput="calcTotal()">
    </div>

    <div class="field">
      <label>💰 ราคา/กก. (บาท)</label>
      <input type="number" id="pricePerKg" placeholder="ราคาต่อกิโล" oninput="calcTotal()">
    </div>

    <div class="total-box">
      <div class="label">ราคารวมที่ได้</div>
      <input type="number" id="totalPrice" placeholder="0">
      <div class="label" style="margin-top:5px; font-size:11px;">แก้ไขได้ถ้าราคาต่างจากที่คำนวณ</div>
    </div>

    <button class="btn-save" id="saveBtn" onclick="saveSale()">💾 บันทึกการขาย</button>
    <div class="status-box" id="statusBox"></div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWuD1R5dM0oZieq7pSSMzEERjy0oqiKSe0rMS8nIDQTXLP1qBfQD_rkZ_m7PQHPAHEg/exec";
    const MY_LIFF_ID = "2010000945-2Tniyge7";

    let lineUserId = "";
    let displayName = "";

    const params = new URLSearchParams(window.location.search);
    const shopFromUrl = params.get("shop") || "";
    const priceFromUrl = params.get("price") || "";
    const itemFromUrl = params.get("item") || "";
    const minKg = parseFloat(params.get("minKg")) || 0;
    const maxKg = parseFloat(params.get("maxKg")) || 0;
    const userFromUrl = params.get("user") || "";
    const userIdFromUrl = params.get("userId") || "";

    function calcTotal() {
      const weight = parseFloat(document.getElementById("weight").value) || 0;
      const price = parseFloat(document.getElementById("pricePerKg").value) || 0;
      if (weight > 0 && price > 0) {
        document.getElementById("totalPrice").value = (weight * price).toFixed(0);
      }
    }

    async function saveSale() {
      const shop = document.getElementById("shopName").value;
      const item = document.getElementById("itemName").value;
      const weight = document.getElementById("weight").value;
      const pricePerKg = document.getElementById("pricePerKg").value;
      const totalPrice = document.getElementById("totalPrice").value;

      if (!shop || !item || !weight || !pricePerKg || !totalPrice) {
        alert("กรุณากรอกข้อมูลให้ครบครับ");
        return;
      }

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.innerText = "⏳ กำลังบันทึก...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "insertSale",
          displayName: displayName || userFromUrl,
          itemName: item,
          weight: weight,
          shop: shop,
          pricePerKg: pricePerKg,
          totalPrice: totalPrice
        })
      });

      showStatus("✅ บันทึกการขายสำเร็จครับ!", "success");

      setTimeout(() => {
        liff.closeWindow();
      }, 1500);
    }

    function showStatus(msg, type) {
      const box = document.getElementById("statusBox");
      box.innerText = msg;
      box.className = "status-box " + type;
      box.style.display = "block";
    }

    async function initLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          displayName = profile.displayName;
        }
      } catch (e) {
        console.error("LIFF Error:", e);
      }

      document.getElementById("shopName").value = shopFromUrl;
      document.getElementById("itemName").value = itemFromUrl;
      document.getElementById("pricePerKg").value = priceFromUrl;

      if (minKg > 0 && maxKg > 0) {
        const midKg = ((minKg + maxKg) / 2).toFixed(1);
        document.getElementById("weight").value = midKg;
        calcTotal();
      }
    }

    initLiff();
  </script>
</body>
</html>
